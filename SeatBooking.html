<html>

    <head>
        <meta charset="UTF-8">
        <title>Vishal Cafe: Seat Booking</title>

        <link rel="Stylesheet" href="css/SeatBooking.css">

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">



    </head>

    <body>

        <!--Page Container-->

        <section class="SeatPage">

            <h1>Please Select Your Seat Type</h1>

            <!--Seat Class Containers-->

            <div class="Seat-Container">

                <!--Silent Seat Card-->

                <div class="Seat-Card" onclick="selectSeat('Silent Seat')">

                   <a href="Menu.html"><img src="images/SilentSeat.png" alt="Silent Seat "></a>
                    <p>Silent Seats</p>



                </div>

                <!--Charging Sets-->

                <div class="Seat-Card" onclick="selectSeat('Charging Seat')">
                    <a href="Menu.html"><img src="images/ChargerPoinSeats.png" alt="Charging Point Seat"></a>
                    <p>Charging Seats</p>

                </div>


                <!--Celebration Seats-->

                <div class="Seat-Card" onclick="selectSeat('Celebration Seat')">
                   <a href="Menu.html"> <img src="images/CelebrationSeat.png" alt="Charging Point Seat"></a>
                    <p>Celebration Seats</p>


                </div>

            </div>





        </section>



    </body>

</html>
